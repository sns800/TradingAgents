AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TradingAgents Web UI - CloudFront(유일한 진입점) + S3 정적 사이트 + Lambda API
  + ECS Fargate 분석 워커 + DynamoDB/S3. 서울 리전(ap-northeast-2)에 배포하며,
  LLM은 Bedrock us-east-1을 호출합니다.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 워커 태스크가 사용할 VPC (기본 VPC)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 워커 태스크용 서브넷 (퍼블릭, 아웃바운드 전용)
  CognitoClientId:
    Type: String
    Default: 11ikj0bqsifr90tf4b37h4t14p
    Description: "인증에 사용할 Cognito User Pool 앱 클라이언트 ID (household-ledger-users 풀의 tradingagents-web 클라이언트)"
  CognitoUserPoolId:
    Type: String
    Default: ap-northeast-2_beRiSnPMY
    Description: "관리자 계정 관리 API가 대상으로 하는 Cognito User Pool ID (household-ledger-users)"
  MaxActiveRuns:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: "동시에 진행할 수 있는 분석 실행(큐 대기 포함) 최대 개수 - Fargate/Bedrock 비용 상한 안전장치"
  DomainName:
    Type: String
    Default: stock.happymstn.com
    Description: "CloudFront 커스텀 도메인 (Route53 happymstn.com 존의 서브도메인)"
  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:199177488202:certificate/0d30f3ab-f543-4a4b-b427-8e9647488317
    Description: "커스텀 도메인용 ACM 인증서 ARN (CloudFront 요구사항: us-east-1 발급)"
  HostedZoneId:
    Type: String
    Default: Z13DFWPUSKITLD
    Description: "happymstn.com Route53 호스팅 존 ID"
  BedrockDeepModel:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  BedrockQuickModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0

Resources:
  # ---------- 저장소 ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tradingagents-webui-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tradingagents-webui-data-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tradingagents-webui-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH

  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: tradingagents-webui-worker
      EmptyOnDelete: true

  # ---------- ECS 워커 ----------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: tradingagents-webui

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/tradingagents-webui-worker
      RetentionInDays: 30

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TradingAgents worker - outbound only, no ingress
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RunsTable.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/runs/*"
              # 종목 카탈로그 배치: catalog/* 쓰기 + 읽기
              # (GetObject는 meta.json 부분 병합 갱신에 필요 - 실패한 시장의
              #  기존 항목을 보존하려면 기존 meta를 읽어야 한다)
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/catalog/*"

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: tradingagents-webui-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${EcrRepo.RepositoryUri}:latest"
          Essential: true
          Environment:
            # Bedrock LLM은 us-east-1에서 호출 (bedrock 클라이언트가 이 env를 읽음)
            - { Name: AWS_REGION, Value: us-east-1 }
            - { Name: AWS_DEFAULT_REGION, Value: us-east-1 }
            # 시스템 리소스(DynamoDB/S3)는 서울 리전 - worker.py가 명시적으로 사용
            - { Name: HOME_REGION, Value: !Ref "AWS::Region" }
            - { Name: TABLE_NAME, Value: !Ref RunsTable }
            - { Name: DATA_BUCKET, Value: !Ref DataBucket }
            - { Name: BEDROCK_DEEP_MODEL, Value: !Ref BedrockDeepModel }
            - { Name: BEDROCK_QUICK_MODEL, Value: !Ref BedrockQuickModel }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: worker

  # ---------- 종목 카탈로그 배치 스케줄 ----------
  # 평일 22:00 KST(= 13:00 UTC)에 기존 워커 태스크 정의를 containerOverrides로
  # 실행해 한국·일본·미국 상장 종목 카탈로그를 수집, S3 catalog/*에 저장한다.
  # (한국 장 마감 후 + 미국 장 시작 전 시간대. 명령만 교체하므로 워커 이미지·
  #  환경변수를 그대로 재사용하며, RUN_ID 없이 동작하는 build_catalog.py를 띄운다)
  CatalogScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-catalog-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 최소권한: 이 클러스터에서 워커 태스크 정의만 실행 가능
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref WorkerTaskDefinition
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt EcsCluster.Arn }
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskRole.Arn
                  - !GetAtt TaskExecutionRole.Arn
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }

  CatalogScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tradingagents-webui-catalog-daily
      Description: "종목 카탈로그 일일 수집 - 평일 22:00 KST (13:00 UTC)"
      ScheduleExpression: cron(0 13 ? * MON-FRI *)
      State: ENABLED
      Targets:
        - Id: catalog-worker
          Arn: !GetAtt EcsCluster.Arn
          RoleArn: !GetAtt CatalogScheduleRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref WorkerTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                # 퍼블릭 서브넷 + 아웃바운드 전용 SG (api_handler의 RunTask와 동일 구성)
                AssignPublicIp: ENABLED
                SecurityGroups: [!Ref WorkerSecurityGroup]
                Subnets: !Ref SubnetIds
          Input: |
            {"containerOverrides": [{"name": "worker", "command": ["python", "webui/catalog/build_catalog.py"]}]}

  # ---------- Lambda API ----------
  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt RunsTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/runs/*"
              # 종목 카탈로그 조회 API: 배치가 쓴 catalog/* 읽기
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/catalog/*"
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref WorkerTaskDefinition
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt EcsCluster.Arn }
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskRole.Arn
                  - !GetAtt TaskExecutionRole.Arn
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }
              # 관리자 계정 관리 API: 지정한 User Pool에 대한 cognito-idp 관리 권한
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminDeleteUser
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tradingagents-webui-api
      Runtime: python3.12
      Handler: api_handler.handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref RunsTable
          DATA_BUCKET: !Ref DataBucket
          CLUSTER_ARN: !GetAtt EcsCluster.Arn
          TASK_DEF: !Ref WorkerTaskDefinition
          SUBNET_IDS: !Join [",", !Ref SubnetIds]
          SECURITY_GROUP: !Ref WorkerSecurityGroup
          CONTAINER_NAME: worker
          MAX_ACTIVE_RUNS: !Ref MaxActiveRuns
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Code:
        # 자리표시자 - 실제 코드는 deploy.sh가 update-function-code로 배포
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": '{"error": "API not deployed yet"}'}

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: AWS_IAM

  # 참고: OAC가 Lambda URL을 호출하려면 InvokeFunctionUrl과 InvokeFunction
  # 두 권한이 모두 필요하다 (공식 문서의 요구사항 - 하나라도 없으면 403).
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ApiInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- CloudFront ----------
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: tradingagents-webui-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LambdaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: tradingagents-webui-lambda-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TradingAgents Web UI
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !Ref LambdaOAC
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          # 관리형 정책 CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # 관리형 정책 CachingDisabled / AllViewerExceptHostHeader
            # (Lambda URL 오리진용 AWS 권장 조합. 인증 토큰은 Authorization이 아닌
            #  x-access-token 헤더로 전달해 OAC SigV4 서명과 충돌하지 않는다)
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # 참고: 403->index.html 매핑은 API 오리진의 인증 오류까지 가려버려 제거함.
        # (해시 라우팅 SPA라 별도 오류 페이지 매핑이 없어도 동작에 지장 없음)

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- CodeBuild (로컬 Docker 없이 워커 이미지 빌드) ----------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt EcrRepo.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/source/*"

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: tradingagents-webui-image
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 30
      Source:
        Type: S3
        Location: !Sub "${DataBucket}/source/source.zip"
        BuildSpec: webui/infra/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: ECR_URI, Value: !GetAtt EcrRepo.RepositoryUri }
          - { Name: AWS_ACCOUNT_ID, Value: !Ref "AWS::AccountId" }

  # stock.happymstn.com -> CloudFront 별칭 레코드 (A/AAAA)
  # Z2FDTNDATAQYW2는 CloudFront 배포판 공통의 고정 호스팅 존 ID다.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CustomDomainURL:
    Value: !Sub "https://${DomainName}"
  CloudFrontURL:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  DataBucketName:
    Value: !Ref DataBucket
  EcrRepoUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  ApiFunctionName:
    Value: !Ref ApiFunction
  ClusterName:
    Value: !Ref EcsCluster
  CodeBuildProject:
    Value: !Ref ImageBuildProject
