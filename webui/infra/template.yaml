AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  TradingAgents Web UI - CloudFront(유일한 진입점) + S3 정적 사이트 + Lambda API
  + ECS Fargate 분석 워커/배치(종목 카탈로그·G20 매크로 수집) + DynamoDB/S3.
  서울 리전(ap-northeast-2)에 배포하며, LLM은 Bedrock us-east-1을 호출합니다.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 워커 태스크가 사용할 VPC (기본 VPC)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 워커 태스크용 서브넷 (퍼블릭, 아웃바운드 전용)
  CognitoClientId:
    Type: String
    Default: 11ikj0bqsifr90tf4b37h4t14p
    Description: "인증에 사용할 Cognito User Pool 앱 클라이언트 ID (household-ledger-users 풀의 tradingagents-web 클라이언트)"
  CognitoUserPoolId:
    Type: String
    Default: ap-northeast-2_beRiSnPMY
    Description: "관리자 계정 관리 API가 대상으로 하는 Cognito User Pool ID (household-ledger-users)"
  MaxActiveRuns:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: "동시에 진행할 수 있는 분석 실행(큐 대기 포함) 최대 개수 - Fargate/Bedrock 비용 상한 안전장치"
  DomainName:
    Type: String
    Default: stock.happymstn.com
    Description: "CloudFront 커스텀 도메인 (Route53 happymstn.com 존의 서브도메인)"
  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:199177488202:certificate/0d30f3ab-f543-4a4b-b427-8e9647488317
    Description: "커스텀 도메인용 ACM 인증서 ARN (CloudFront 요구사항: us-east-1 발급)"
  HostedZoneId:
    Type: String
    Default: Z13DFWPUSKITLD
    Description: "happymstn.com Route53 호스팅 존 ID"
  BedrockDeepModel:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  BedrockQuickModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
  # ---------- G20 매크로 대시보드 파라미터 ----------
  # 키가 필요한 소스는 키가 없으면 그 소스만 건너뛰도록 설계돼 있어(CONTRACT 7장)
  # 기본값을 빈 문자열로 두고 배포 시 env로 주입한다. NoEcho로 콘솔·이벤트에 노출 방지.
  FredApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "FRED API 키 (미국 지표 폴백용). 비우면 fred 소스만 건너뛴다"
  EmberApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Ember 전력 데이터 API 키 (전력 구성). 비우면 ember 소스만 건너뛴다"
  MacroLlmDailyTokenBudget:
    Type: Number
    Default: 2000000
    MinValue: 0
    Description: "매크로 정성 처리(Bedrock)의 1일 토큰 상한 - 초과하면 수집기가 LLM 단계를 건너뛴다(비용 상한 안전장치)"
  MacroLlmModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: "매크로 정성 처리용 Bedrock 모델 (중앙은행 성명·여론조사 표 추출 - 저비용 Haiku가 기본)"
  MacroScheduleEnabled:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: "매크로 일일 수집 스케줄 on/off - 수집기 개발 중이거나 비용을 멈추고 싶을 때 DISABLED"

Resources:
  # ---------- 저장소 ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tradingagents-webui-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tradingagents-webui-data-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tradingagents-webui-runs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH

  # G20 매크로 단일 테이블 - 관측치·최신값·국가 스냅샷·정성 문서·수집 로그를
  # pk 접두사(OBS#/LATEST#/SNAPSHOT#/DOC#/INGEST#/SERIES#/CONFIG)로 구분해 담는다.
  # 키 설계는 webui/macro/CONTRACT.md 4장이 단일 기준이며 GSI는 두지 않는다
  # (모든 화면이 pk 지정 Query 또는 GetItem 1회로 해결되도록 설계됨).
  # 30년치 시계열을 수 시간에 걸쳐 외부 API로 모아 만든 데이터라 스택을 지우거나
  # 테이블이 교체되는 변경이 와도 데이터는 남긴다(Retain).
  MacroTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: tradingagents-webui-macro
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      # 수집 버그로 값을 덮어써도 되돌릴 수 있게 PITR 활성 (온디맨드 소용량이라 비용 미미)
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: tradingagents-webui-worker
      EmptyOnDelete: true

  # ---------- ECS 워커 ----------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: tradingagents-webui

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/tradingagents-webui-worker
      RetentionInDays: 30

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TradingAgents worker - outbound only, no ingress
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt RunsTable.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/runs/*"
              # 종목 카탈로그 배치: catalog/* 쓰기 + 읽기
              # (GetObject는 meta.json 부분 병합 갱신에 필요 - 실패한 시장의
              #  기존 항목을 보존하려면 기존 meta를 읽어야 한다)
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/catalog/*"
              # G20 매크로 수집기(webui/macro/collect.py): 매크로 테이블 읽기·쓰기.
              # Query/GetItem은 LATEST·SNAPSHOT 재생성과 개정 이력 비교(기존 값 확인)에,
              # PutItem/UpdateItem은 관측치 upsert(항목 단위 조건부 put → update)에 쓴다.
              # DeleteItem은 **동시 실행 락(CONFIG / LOCK#collect) 해제**에만 필요하다 —
              # 관측치·문서는 지우지 않는다. BatchWriteItem은 코드가 쓰지 않아 부여하지 않는다.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: !GetAtt MacroTable.Arn
              # 매크로 원본 응답(macro/raw/*) 보존과 문서 전문(macro/docs/*) 저장.
              # GetObject는 "원문이 바뀐 문서만 LLM에 넣는" 변경 감지에 필요하다
              # (이전 회차 원문을 읽어 해시를 비교 - LLM 비용의 절반 이상을 아낀다).
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/macro/*"
              # 증분 수집 판단용 목록 조회 (prefix를 macro/로 제한)
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike: { "s3:prefix": "macro/*" }
              # 참고: top_companies 지표는 카탈로그 배치가 만든 catalog/*를 읽어
              # 시가총액 상위를 뽑으므로, 위 catalog/* GetObject를 그대로 쓴다(추가 없음).
              # Bedrock(정성 처리)도 위 InvokeModel "*" 정책을 그대로 재사용한다.

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: tradingagents-webui-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub "${EcrRepo.RepositoryUri}:latest"
          Essential: true
          Environment:
            # Bedrock LLM은 us-east-1에서 호출 (bedrock 클라이언트가 이 env를 읽음)
            - { Name: AWS_REGION, Value: us-east-1 }
            - { Name: AWS_DEFAULT_REGION, Value: us-east-1 }
            # 시스템 리소스(DynamoDB/S3)는 서울 리전 - worker.py가 명시적으로 사용
            - { Name: HOME_REGION, Value: !Ref "AWS::Region" }
            - { Name: TABLE_NAME, Value: !Ref RunsTable }
            - { Name: DATA_BUCKET, Value: !Ref DataBucket }
            - { Name: BEDROCK_DEEP_MODEL, Value: !Ref BedrockDeepModel }
            - { Name: BEDROCK_QUICK_MODEL, Value: !Ref BedrockQuickModel }
            # G20 매크로 수집기용 (webui/macro/collect.py). API 키가 비어 있어도
            # 수집기는 해당 소스만 건너뛰고 나머지를 진행한다(CONTRACT 7장·10장).
            # 토큰 예산은 Number 파라미터지만 컨테이너 환경변수는 문자열이라
            # CloudFormation이 !Ref 값을 문자열로 넘긴다(MaxActiveRuns와 동일 패턴).
            - { Name: MACRO_TABLE_NAME, Value: !Ref MacroTable }
            - { Name: FRED_API_KEY, Value: !Ref FredApiKey }
            - { Name: EMBER_API_KEY, Value: !Ref EmberApiKey }
            - { Name: MACRO_LLM_MODEL, Value: !Ref MacroLlmModel }
            - { Name: MACRO_LLM_DAILY_TOKEN_BUDGET, Value: !Ref MacroLlmDailyTokenBudget }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: worker

  # ---------- 종목 카탈로그 배치 스케줄 ----------
  # 평일 22:00 KST(= 13:00 UTC)에 기존 워커 태스크 정의를 containerOverrides로
  # 실행해 한국·일본·미국 상장 종목 카탈로그를 수집, S3 catalog/*에 저장한다.
  # (한국 장 마감 후 + 미국 장 시작 전 시간대. 명령만 교체하므로 워커 이미지·
  #  환경변수를 그대로 재사용하며, RUN_ID 없이 동작하는 build_catalog.py를 띄운다)
  CatalogScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        # 이 역할은 아래 MacroScheduleRule도 함께 사용한다 - 권한이 "이 클러스터의
        # 워커 태스크 정의를 RunTask"라는 태스크 정의 단위로 부여돼 있어, 명령
        # (containerOverrides)만 다른 스케줄에는 그대로 유효하다.
        - PolicyName: run-catalog-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 최소권한: 이 클러스터에서 워커 태스크 정의만 실행 가능
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref WorkerTaskDefinition
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt EcsCluster.Arn }
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskRole.Arn
                  - !GetAtt TaskExecutionRole.Arn
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }

  CatalogScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tradingagents-webui-catalog-daily
      Description: "종목 카탈로그 일일 수집 - 평일 22:00 KST (13:00 UTC)"
      ScheduleExpression: cron(0 13 ? * MON-FRI *)
      State: ENABLED
      Targets:
        - Id: catalog-worker
          Arn: !GetAtt EcsCluster.Arn
          RoleArn: !GetAtt CatalogScheduleRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref WorkerTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                # 퍼블릭 서브넷 + 아웃바운드 전용 SG (api_handler의 RunTask와 동일 구성)
                AssignPublicIp: ENABLED
                SecurityGroups: [!Ref WorkerSecurityGroup]
                Subnets: !Ref SubnetIds
          Input: |
            {"containerOverrides": [{"name": "worker", "command": ["python", "webui/catalog/build_catalog.py"]}]}

  # ---------- G20 매크로 일일 수집 스케줄 ----------
  # 매일 06:00 KST(= 전날 21:00 UTC)에 같은 워커 태스크 정의를 command만 바꿔 띄운다.
  # 소스별 실제 갱신 주기(일·주·월·분기)는 collect.py가 INGEST#<source>의 next_due를
  # 보고 내부에서 판단하므로, EventBridge는 하루 1회 기동만 담당한다(CONTRACT 12장).
  # 아침 6시인 이유: 미국 장 마감·유럽 발표가 모두 끝난 뒤라 하루치 데이터가 완결된다.
  # RoleArn은 카탈로그 스케줄의 역할을 재사용한다(위 주석 참고 - 태스크 정의 단위 권한).
  MacroScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tradingagents-webui-macro-daily
      Description: "G20 매크로 데이터 일일 수집 - 매일 06:00 KST (21:00 UTC 전날)"
      ScheduleExpression: cron(0 21 * * ? *)
      # 파라미터로 끌 수 있게 한 이유: 수집기 개발 중 자동 실행을 막고 수동
      # RunTask만 쓰거나, 비용을 즉시 멈추고 싶을 때 스택 변경 없이 전환 가능.
      State: !Ref MacroScheduleEnabled
      Targets:
        - Id: macro-worker
          Arn: !GetAtt EcsCluster.Arn
          RoleArn: !GetAtt CatalogScheduleRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref WorkerTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                # 퍼블릭 서브넷 + 아웃바운드 전용 SG (카탈로그 규칙과 동일 구성)
                AssignPublicIp: ENABLED
                SecurityGroups: [!Ref WorkerSecurityGroup]
                Subnets: !Ref SubnetIds
          Input: |
            {"containerOverrides": [{"name": "worker", "command": ["python", "webui/macro/collect.py"]}]}

  # ---------- Lambda API ----------
  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt RunsTable.Arn
              # 실행 삭제 API: runs/{id}/ 이하 보고서 일괄 삭제 (목록 조회 포함)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${DataBucket.Arn}/runs/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike: { "s3:prefix": "runs/*" }
              # 종목 카탈로그 조회 API: 배치가 쓴 catalog/* 읽기
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/catalog/*"
              # 매크로 대시보드 API(/api/macro/*): 관측치·문서·스냅샷 조회.
              # Query는 시계열(OBS)·개요(LATEST)·문서 목록(DOC)에 쓰고,
              # UpdateItem은 관리자 검토(AI 문서 승인·반려, 조건부 update)와
              # CONFIG#MACRO(LLM 예산) 조정에만 쓴다 - 수집 쓰기는 워커 담당.
              # PutItem은 API 코드가 쓰지 않으므로 부여하지 않는다 (수집 락 확인은 GetItem).
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  # BatchGetItem: /api/macro/meta가 지표 사전(SERIES#*/META) 38건을 25건 단위로
                  # 한 번에 읽는다. 없으면 macro_api가 get_item 반복으로 폴백하지만 매 요청
                  # AccessDenied를 먼저 겪어 느려지므로 명시적으로 허용한다.
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt MacroTable.Arn
              # 정성 문서 전문 읽기 - 문서 상세에서 인용 포함 원문(.md)을 그대로 보여준다.
              # macro/raw/*(원본 응답)는 API에 노출하지 않으므로 docs/ 만 허용.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/macro/docs/*"
              # 아래 ecs:RunTask/PassRole은 분석 실행용이지만 워커 태스크 정의가
              # 공용이라 POST /api/admin/macro/refresh(command만 교체)도 그대로 쓴다.
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref WorkerTaskDefinition
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt EcsCluster.Arn }
              # 실행 취소 API: 이 클러스터의 태스크만 중지 가능
              - Effect: Allow
                Action: ecs:StopTask
                Resource: "*"
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt EcsCluster.Arn }
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskRole.Arn
                  - !GetAtt TaskExecutionRole.Arn
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }
              # 관리자 계정 관리 API: 지정한 User Pool에 대한 cognito-idp 관리 권한
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminDeleteUser
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tradingagents-webui-api
      Runtime: python3.12
      Handler: api_handler.handler
      Role: !GetAtt ApiLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref RunsTable
          MACRO_TABLE_NAME: !Ref MacroTable
          DATA_BUCKET: !Ref DataBucket
          CLUSTER_ARN: !GetAtt EcsCluster.Arn
          TASK_DEF: !Ref WorkerTaskDefinition
          SUBNET_IDS: !Join [",", !Ref SubnetIds]
          SECURITY_GROUP: !Ref WorkerSecurityGroup
          CONTAINER_NAME: worker
          MAX_ACTIVE_RUNS: !Ref MaxActiveRuns
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
      Code:
        # 자리표시자 - 실제 코드는 deploy.sh가 update-function-code로 배포
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": '{"error": "API not deployed yet"}'}

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: AWS_IAM

  # 참고: OAC가 Lambda URL을 호출하려면 InvokeFunctionUrl과 InvokeFunction
  # 두 권한이 모두 필요하다 (공식 문서의 요구사항 - 하나라도 없으면 403).
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ApiInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- CloudFront ----------
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: tradingagents-webui-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  LambdaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: tradingagents-webui-lambda-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TradingAgents Web UI
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !Ref LambdaOAC
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          # 관리형 정책 CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # 관리형 정책 CachingDisabled / AllViewerExceptHostHeader
            # (Lambda URL 오리진용 AWS 권장 조합. 인증 토큰은 Authorization이 아닌
            #  x-access-token 헤더로 전달해 OAC SigV4 서명과 충돌하지 않는다)
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # 참고: 403->index.html 매핑은 API 오리진의 인증 오류까지 가려버려 제거함.
        # (해시 라우팅 SPA라 별도 오류 페이지 매핑이 없어도 동작에 지장 없음)

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- CodeBuild (로컬 Docker 없이 워커 이미지 빌드) ----------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt EcrRepo.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/source/*"

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: tradingagents-webui-image
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 30
      Source:
        Type: S3
        Location: !Sub "${DataBucket}/source/source.zip"
        BuildSpec: webui/infra/buildspec.yml
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: ECR_URI, Value: !GetAtt EcrRepo.RepositoryUri }
          - { Name: AWS_ACCOUNT_ID, Value: !Ref "AWS::AccountId" }

  # stock.happymstn.com -> CloudFront 별칭 레코드 (A/AAAA)
  # Z2FDTNDATAQYW2는 CloudFront 배포판 공통의 고정 호스팅 존 ID다.
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CustomDomainURL:
    Value: !Sub "https://${DomainName}"
  CloudFrontURL:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  DataBucketName:
    Value: !Ref DataBucket
  MacroTableName:
    Value: !Ref MacroTable
  EcrRepoUri:
    Value: !GetAtt EcrRepo.RepositoryUri
  ApiFunctionName:
    Value: !Ref ApiFunction
  ClusterName:
    Value: !Ref EcsCluster
  CodeBuildProject:
    Value: !Ref ImageBuildProject
