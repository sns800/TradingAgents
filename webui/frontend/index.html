<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingAgents 분석 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title-row">
        <h1>📈 TradingAgents 분석 대시보드</h1>
        <span class="badge badge-warning">⚠️ 연구용 도구로 투자 조언이 아님</span>
        <div id="header-user" class="header-user" hidden>
          <span id="user-email" class="user-email"></span>
          <button type="button" id="btn-logout" class="btn btn-ghost btn-logout">로그아웃</button>
        </div>
      </div>
      <p class="header-desc">여러 LLM 에이전트가 협업하여 주식 매매 결정(BUY/SELL/HOLD)을 분석합니다. 분석을 실행하고 결과 보고서를 확인하세요.</p>
    </div>
  </header>

  <main id="app" class="container">
    <!-- 화면 전환 탭 -->
    <nav id="app-nav" class="app-nav" hidden>
      <a href="#/" id="nav-analysis" class="nav-tab active">분석</a>
      <a href="#/catalog" id="nav-catalog" class="nav-tab">종목 탐색</a>
    </nav>

    <!-- 로그인 화면 -->
    <section id="view-login" hidden>
      <div class="card login-card">
        <h2>로그인</h2>
        <p class="login-desc">가족 계정(가계부와 동일)으로 로그인하세요</p>
        <form id="login-form">
          <div class="form-field">
            <label for="login-email">이메일</label>
            <input type="email" id="login-email" autocomplete="username" required>
          </div>
          <div class="form-field">
            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
          </div>
          <button type="submit" id="btn-login" class="btn btn-primary btn-login">로그인</button>
          <p id="login-error" class="form-error" hidden></p>
        </form>
      </div>
    </section>

    <!-- 목록 화면 -->
    <section id="view-list" hidden>
      <section class="card form-card">
        <h2>새 분석 시작</h2>
        <form id="new-run-form">
          <div class="form-grid">
            <div class="form-field">
              <label for="input-ticker">종목 코드</label>
              <input type="text" id="input-ticker" placeholder="AAPL, 005930.KS, BTC-USD" autocomplete="off" required>
            </div>
            <div class="form-field">
              <label for="input-date">분석 날짜</label>
              <input type="date" id="input-date" required>
            </div>
            <div class="form-field">
              <label for="input-depth">분석 깊이</label>
              <select id="input-depth">
                <option value="1">얕게 (빠름·저비용)</option>
                <option value="3">중간 (균형)</option>
                <option value="5">깊게 (느림·고비용)</option>
              </select>
            </div>
            <div class="form-field form-field-submit">
              <button type="submit" id="btn-submit" class="btn btn-primary">분석 시작</button>
            </div>
          </div>
          <p id="form-error" class="form-error" hidden></p>
          <div id="form-suggest" class="form-suggest" hidden>
            <p class="form-suggest-title">혹시 이 종목인가요?</p>
            <div id="form-suggest-list" class="form-suggest-list"></div>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>실행 목록</h2>
          <span id="list-status" class="list-status"></span>
        </div>
        <div id="runs-list" class="runs-list">
          <p class="empty-msg">불러오는 중…</p>
        </div>
      </section>
    </section>

    <!-- 상세 화면 -->
    <section id="view-detail" hidden>
      <button id="btn-back" class="btn btn-ghost">← 목록으로 돌아가기</button>
      <section class="card" id="detail-summary"></section>
      <section class="card" id="detail-reports" hidden>
        <h2>보고서</h2>
        <div class="report-layout">
          <nav id="report-nav" class="report-nav"></nav>
          <article id="report-content" class="report-content markdown-body"></article>
        </div>
      </section>
    </section>

    <!-- 종목 탐색 화면 -->
    <section id="view-catalog" hidden>
      <section class="card">
        <h2>종목 탐색</h2>
        <div class="catalog-toolbar">
          <div id="market-toggle" class="market-toggle" role="group" aria-label="시장 선택">
            <button type="button" data-market="KR" class="active">한국</button>
            <button type="button" data-market="JP">일본</button>
            <button type="button" data-market="US">미국</button>
          </div>
          <input type="text" id="catalog-search" class="catalog-search" placeholder="종목명 또는 티커 검색" autocomplete="off" aria-label="종목 검색">
          <select id="catalog-sector" aria-label="업종 필터">
            <option value="">전체 업종</option>
          </select>
          <select id="catalog-sort" aria-label="정렬 기준">
            <option value="name">이름순</option>
            <option value="price">종가순</option>
            <option value="market_cap">시총순</option>
          </select>
          <select id="catalog-order" aria-label="정렬 방향">
            <option value="asc">오름차순</option>
            <option value="desc">내림차순</option>
          </select>
        </div>
        <div id="catalog-status" class="catalog-status" hidden></div>
        <div id="catalog-table-wrap" class="catalog-table-wrap">
          <table class="catalog-table">
            <thead>
              <tr>
                <th>종목명</th>
                <th>티커</th>
                <th>시장</th>
                <th>업종</th>
                <th class="num">종가</th>
                <th class="num">시총</th>
              </tr>
            </thead>
            <tbody id="catalog-body"></tbody>
          </table>
        </div>
        <p id="catalog-empty" class="empty-msg" hidden></p>
        <div id="catalog-footer" class="catalog-footer" hidden>
          <div class="catalog-pager">
            <button type="button" id="catalog-prev" class="btn btn-ghost btn-pager">← 이전</button>
            <span id="catalog-pageinfo" class="catalog-pageinfo"></span>
            <button type="button" id="catalog-next" class="btn btn-ghost btn-pager">다음 →</button>
          </div>
          <span id="catalog-generated" class="catalog-generated"></span>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <footer class="site-footer">
    <p>TradingAgents — 멀티 에이전트 LLM 트레이딩 연구 프레임워크</p>
  </footer>

  <script src="vendor/marked.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
