# ============================================================
# [모듈 개요] G20 매크로 지표 레지스트리 — CONTRACT.md 2장의 단일 구현체
#
# 이 파일은 "어떤 국가"의 "어떤 지표"를 "어떤 소스·시리즈"에서 받아 어떤 빈도로
# 저장하는지를 선언한다. webui/macro/registry.py 가 읽어 Country/Indicator/Registry
# 객체로 바꾸고, 수집기(sources/*)·집계(aggregate.py)·저장(store.py)·API가 모두 이
# 선언만 참조한다. 하드코딩된 국가·시리즈 목록을 다른 모듈에 두지 않는다.
#
# 형식
#   countries: CONTRACT 1장 20개(19개국 + 유로존 EU). iso(ISO 3166-1 alpha-2)가 시스템 키.
#     codes.bis      BIS ISO2        (유로존 XM)
#     codes.oecd     OECD ISO3       (유로존 EA20)
#     codes.wb       World Bank ISO3 (유로존 EMU). 응답의 country.id는 "XC"이므로 국가 매칭은
#                    반드시 `countryiso3code=EMU`로 한다 (2026-09-20 실측)
#     codes.imf      IMF ISO3       (유로존 U2 — MFS_MA에는 U2 시계열이 없다, imf.py 실측)
#     codes.yahoo_fx { symbol, invert } · invert=true면 심볼이 USD/현지통화이므로 1/x 해야
#                    CONTRACT의 fx_usd(현지통화/USD)가 된다. US는 null(환율 1).
#     codes.fred_fx  FRB H.10 일별 환율 시리즈. `DEXUS*` 로 시작하면 USD/현지통화이므로
#                    yahoo_fx.invert 와 같은 규칙으로 역수를 취한다. 없으면 null.
#     codes.ember    Ember API/CSV 국가명 + iso3 (공개 CSV의 유로존 Area는 'EU', ISO3 빈 값)
#     codes.owid     OWID 에너지 CSV 국가명 + iso_code
#   indicators: CONTRACT 2장 "지표 id 고정 목록" 38개 전부. id·순서를 registry.py의
#     INDICATOR_IDS 와 정확히 일치시킨다(validate()가 차이를 ValueError로 보고).
#     unit         "%" | index | usd | usd_bn | lcu_bn | lcu_per_usd | pct_gdp | pct_share | score
#                  usd_bn=10억 USD, usd=USD 원단위(World Bank 원값), lcu_bn=자국통화 10억
#                  (m2_level. USD 환산을 하지 않으므로 국가 간 절대값 비교 금지)
#     category     politics | monetary | fx | structure | energy | fiscal | market
#     native_freq  D | W | M | Q | Y | E  (원천 빈도)
#     store_freqs  저장 빈도. native 이하(같거나 더 낮은 빈도)만 허용
#     agg          last(기말) | mean | sum | none(원천 빈도 그대로만 저장)
#     yoy_from     전년비 파생의 원천 지표 id (aggregate.yoy 입력)
#     derived_from 그 외 파생의 원천 지표 id (aggregate.fx_value_index 등)
#     composite    true면 value 대신 payload(JSON 목록)에 저장 (CONTRACT 3장)
#     coverage_note 2026-09-20 소스 모듈 실측 커버리지 메모(자유 문자열, 선택). registry.py의
#                  Indicator.extra 로 흡수되며 검증·API 메타(to_api_meta)에는 쓰이지 않는다.
#     sources      우선순위 순. 앞선 소스 실패/무자료 시 다음 소스로 폴백하며
#                  flags 에 fallback_source 를 붙인다. only 가 있으면 해당 iso 전용.
#                  key/note/freq 는 소스 모듈용 힌트(선택 필드). freq 를 적으면 그 항목만
#                  원천 빈도가 다르다는 뜻이다(예: 연간 폴백).
#                  via 는 name=derived 인 파생 항목의 원자료 제공 소스(예: owid)이며,
#                  registry.indicators_for_source("owid") 가 이 값도 함께 본다.
#
# 수정 시 CONTRACT.md 2장을 준수한다. unit/category/freq/agg 열거값, 지표 id 목록,
# 유로 참조 규칙(policy_rate/m2_*/fx_* 는 euro 회원국 수집 제외)은 CONTRACT가 기준이며
# 이 파일이 아니라 CONTRACT.md 를 먼저 고친다.
# ============================================================

