indicators:
  # ---------- 통화·금리 ----------
  - id: policy_rate
    name_ko: 정책금리
    unit: "%"
    category: monetary
    native_freq: D
    store_freqs: [D, M, Q, Y]
    agg: last
    yoy_from: null
    derived_from: null
    decimals: 2
    higher_is: neutral
    composite: false
    coverage_note: "16/20 (2026-09-20 BIS 실측). AR 없음 — BIS 미제공이고 대체 소스(BCRA) 미구현이라
                    LATEST 항목이 생기지 않는다(프론트 '—'). DE/FR/IT는 EU 값 참조."
    sources:
      - { name: bis, series: "WS_CBPOL/1.0/D.{bis}", priority: 1,
          note: "일별 기말. 2026-09-20 실측 커버리지 16/20 (AR 미수록, DE/FR/IT는 EU 참조).
                 AR: BIS 미제공, 대체 소스 미구현(BCRA)" }
      - { name: fred, series: "FEDFUNDS", only: [US], freq: M, priority: 2,
          note: "US 폴백(연방기금 실효금리 월평균). BIS가 US를 덮으므로 보조용" }

  - id: fx_usd
    name_ko: 환율(현지통화/USD)
    unit: lcu_per_usd
    category: fx
    native_freq: D
    store_freqs: [D, M, Q, Y]
    agg: last
    yoy_from: null
    derived_from: null
    decimals: 4
    higher_is: neutral
    composite: false
    coverage_note: "20/20 (2026-09-20 BIS WS_XRU 기말 실측). 월별 1차는 BIS, 실패 시 yahoo 일별을
                    D→M 기말 집계해 채운다(flags: fallback_source)."
    sources:
      - { name: bis, series: "WS_XRU/1.0/M.{bis}.{ccy}.E", freq: M, priority: 1,
          note: "키는 {FREQ}.{REF_AREA}.{CURRENCY}.{COLLECTION}. 3번째 차원은 현지통화(US만 USD),
                 COLLECTION은 E=기말(A=기간평균). 제안서 부록 A의 `M.{ISO}.USD.A`는 2026-09-20
                 실측으로 오류 확인. 커버리지 20/20" }
      - { name: yahoo, series: "{yahoo_fx}", freq: D, priority: 2,
          note: "codes.yahoo_fx.invert=true면 1/x (비공식 소스, 일별 보조)" }
      - { name: fred, series: "{fred_fx}", freq: D, priority: 3,
          note: "H.10. DEXUS* 는 USD/현지통화이므로 역수" }

  - id: fx_value_index
    name_ko: 통화가치 지수
    unit: index
    category: fx
    native_freq: D
    store_freqs: [D, M, Q, Y]
    agg: last
    yoy_from: null
    derived_from: fx_usd
    decimals: 2
    higher_is: neutral
    composite: false
    coverage_note: "fx_usd 파생 → 커버리지는 fx_usd(20/20)와 같다. US는 환율 1이라 항상 100."
    sources:
      - { name: derived, series: "aggregate.fx_value_index(fx_usd, base)", priority: 1,
          note: "기준환율/환율 × 100 (값 상승 = 통화 강세)" }

  - id: m2_level
    name_ko: 광의통화(M2) 잔액
    unit: lcu_bn
    category: monetary
    native_freq: M
    store_freqs: [M, Q, Y]
    agg: last
    yoy_from: null
    derived_from: null
    decimals: 1
    higher_is: neutral
    composite: false
    coverage_note: "IMF 11/20 (최신 9개국 KR JP AU BR ID MX TR ZA AR · 정지 2개국 CA 2008-12, RU 2021-11)
                    + FRED US 1개국 = 12/20. EU·CN·GB·IN·SA: ECB/국가통계 소스 미구현."
    unit_note: "자국통화 10억 단위 잔액(lcu_bn) — imf.py의 M2_LEVEL_UNIT/METHOD_LEVEL과 일치한다.
                원천(IMF MFS BM_MAI.XDC.M)은 자국통화 원단위이고 소스 모듈이 1e9로 나눠 저장한다
                (CSV의 SCALE 열은 표시용 힌트라 곱하지 않는다). USD 환산을 하지 않으므로 국가 간
                절대값 비교는 금지이고, m2_yoy는 환율 효과가 없는 자국통화 기준 증가율이다.
                US 폴백(FRED M2SL)만 entry unit이 usd_bn(10억 달러)이다."
    sources:
      - { name: imf, series: "MFS_MA/{imf}.BM_MAI.XDC.M", priority: 1,
          note: "IMF SDMX 3.0 IMF.STA/MFS_MA. 차원 COUNTRY.INDICATOR.UNIT.FREQUENCY이며 와일드카드가
                 동작하지 않아 4개 차원을 모두 채운다. 기간 필터는 c[TIME_PERIOD]=ge:YYYY-MM.
                 2026-09-20 실측 11/20 — 최신 KR JP AU BR ID MX TR ZA AR, 정지 CA·RU,
                 미제공 US CN EU DE FR IT GB IN SA. codes.imf의 EU=U2는 MFS_MA에 없다" }
      - { name: fred, series: "M2SL", only: [US], freq: M, unit: usd_bn, priority: 2,
          note: "US 전용. 계절조정 10억 달러 잔액이라 entry unit은 usd_bn(지표 기본 lcu_bn과 다름)" }

  - id: m2_yoy
    name_ko: 광의통화 전년비
    unit: "%"
    category: monetary
    native_freq: M
    store_freqs: [M, Q, Y]
    agg: last
    yoy_from: m2_level
    derived_from: null
    decimals: 2
    higher_is: neutral
    composite: false
    coverage_note: "m2_level(12/20)에서 파생 + World Bank 연간 폴백. 월별은 IMF·FRED가 주는 국가만."
    sources:
      - { name: derived, series: "aggregate.yoy(m2_level, lag=12)", priority: 1,
          note: "자국통화(lcu_bn) 기준이라 환율 효과가 없다. imf.py도 같은 계산을 직접 내보낸다
                 (source=imf, METHOD_YOY)" }
      - { name: worldbank, series: "FM.LBL.BMNY.ZG", freq: Y, unit: "%", priority: 9,
          note: "연간 폴백(freq Y). 월별 소스가 없는 국가(EU·CN·GB·IN·SA 등)에만 쓴다" }

  # ---------- 물가 ----------
  - id: cpi_index
    name_ko: 소비자물가지수
    unit: index
    category: monetary
    native_freq: M
    store_freqs: [M, Q, Y]
    agg: last
    yoy_from: null
    derived_from: null
    decimals: 2
    higher_is: neutral
    composite: false
    coverage_note: "18/20 (2026-09-20 OECD 실측, 데이터플로 3개 합산) — AR·RU 없음(RU는 2022-03 이후 정지).
                    기준연도가 다른 지수를 이어 붙이지 않도록 oecd.py가 국가별로 데이터플로 하나만 고정한다."
    sources:
      - { name: oecd, series: "OECD.SDD.TPS,DSD_G20_PRICES@DF_G20_PRICES",
          key: "{oecd}.M..CPI.IX._T.N._Z", priority: 1,
          note: "차원 순서 REF_AREA.FREQ.METHODOLOGY.MEASURE.UNIT_MEASURE.EXPENDITURE.ADJUSTMENT.TRANSFORMATION.
                 METHODOLOGY는 국가마다 N/HICP라 비워 둔다(와일드카드). 이 데이터플로의 유로존 REF_AREA는
                 EA20이 아니라 EA — oecd.py가 codes.oecd EA20→EA 별칭으로 흡수한다. 2026-08까지 최신" }
      - { name: oecd, series: "OECD.SDD.TPS,DSD_PRICES_COICOP2018@DF_PRICES_C2018_ALL",
          key: "{oecd}.M.N.CPI.IX._T.N._Z", priority: 2,
          note: "COICOP 2018. CAN·DEU·FRA·ITA·JPN·MEX·SAU·TUR·ZAF가 2026-07/08까지 최신" }
      - { name: oecd, series: "OECD.SDD.TPS,DSD_PRICES@DF_PRICES_ALL",
          key: "{oecd}.M.N.CPI.IX._T.N._Z", priority: 3,
          note: "COICOP 1999(제안서가 가리킨 데이터플로). 9개국이 정지 상태
                 (JPN 2021-06 · MEX 2024-07 · EA20/FRA/ITA/TUR 2025-12 · RUS 2022-03 등)라 보강용" }
      - { name: fred, series: "CPIAUCSL", only: [US], freq: M, unit: index, priority: 4,
          note: "US 폴백(계절조정). OECD가 US를 덮으므로 보조용" }

