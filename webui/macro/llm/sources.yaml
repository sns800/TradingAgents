# ------------------------------------------------------------------ 에너지 정책
# iso → {sources: [IEA 국가 페이지, 정부 에너지 담당 부처·계획 페이지]}
# IEA URL은 모두 403(Cloudflare 봇 차단)이지만 슬러그는 sitemap-countries.xml로
# 존재를 확인했다. energy_policy.py는 개별 URL 실패를 건너뛰고 나머지로 진행한다.
energy_policy:
  KR:
    sources:
      - https://www.iea.org/countries/korea
      - https://mcee.go.kr/eng/web/main.do
    notes: "IEA 403(봇 차단, 슬러그 korea 확인). 정부 200 — 2025-09 조직개편으로 기후에너지환경부(MCEE)가 에너지 담당(구 MOTIE 아님)."
  US:
    sources:
      - https://www.iea.org/countries/united-states
      - https://www.energy.gov/topics/policy
    notes: "IEA 403(봇 차단). 정부 200 — energy.gov/policy/energy-policy는 404였다."
  JP:
    sources:
      - https://www.iea.org/countries/japan
      - https://www.enecho.meti.go.jp/en/
    notes: "IEA 403(봇 차단). 정부 200 — METI 자원에너지청(에너지기본계획)."
  CN:
    sources:
      - https://www.iea.org/countries/china
      - https://www.nea.gov.cn/
    notes: "IEA 403(봇 차단). 정부 200 — 국가에너지국(NEA)."
  EU:
    sources:
      - https://www.iea.org/regions/europe
      - https://energy.ec.europa.eu/strategy/energy-union_en
    notes: "IEA regions/europe 403(봇 차단, sitemap-other.xml에 존재). regions/european-union은 없다. EU 200."
  DE:
    sources:
      - https://www.iea.org/countries/germany
      - https://www.bmwk.de/Redaktion/EN/Dossier/energy-transition.html
    notes: "IEA 403(봇 차단). 정부 200(bundeswirtschaftsministerium.de로 301)."
  FR:
    sources:
      - https://www.iea.org/countries/france
      - https://www.ecologie.gouv.fr/politiques-publiques/programmations-pluriannuelles-lenergie-ppe
    notes: "IEA 403(봇 차단). 정부 200 — 슬러그가 복수형(programmations)이며 단수형은 404. PPE3(2026-2035) 2026-02 공표."
  IT:
    sources:
      - https://www.iea.org/countries/italy
      - https://www.mase.gov.it/
    notes: "IEA 403(봇 차단). 정부 200 — MASE(/portale/home으로 리다이렉트)."
  GB:
    sources:
      - https://www.iea.org/countries/united-kingdom
      - https://www.gov.uk/government/organisations/department-for-energy-security-and-net-zero
    notes: "IEA 403(봇 차단). 정부 200 — DESNZ."
  CA:
    sources:
      - https://www.iea.org/countries/canada
      - https://natural-resources.canada.ca/energy-sources
    notes: "IEA 403(봇 차단). 정부 200 — NRCan 신 도메인(nrcan.gc.ca 아님)."
  AU:
    sources:
      - https://www.iea.org/countries/australia
      - https://www.dcceew.gov.au/energy
    notes: "IEA 403(봇 차단). 정부 200 — 단 Akamai WAF 때문에 Accept-Encoding 헤더가 없으면 연결이 끊긴다(requests 기본 헤더에는 포함됨)."
  IN:
    sources:
      - https://www.iea.org/countries/india
      - https://powermin.gov.in/
    notes: "IEA 403(봇 차단). 정부 200 — 전력부."
  ID:
    sources:
      - https://www.iea.org/countries/indonesia
      - https://www.esdm.go.id/
    notes: "IEA 403(봇 차단). 정부 200 — 에너지광물자원부(ESDM)."
  BR:
    sources:
      - https://www.iea.org/countries/brazil
      - https://www.gov.br/mme/pt-br
    notes: "IEA 403(봇 차단). 정부 200 — 광업에너지부(MME)."
  MX:
    sources:
      - https://www.iea.org/countries/mexico
      - https://www.gob.mx/sener
    notes: "IEA 403(봇 차단). 정부 200 — SENER."
  AR:
    sources:
      - https://www.iea.org/countries/argentina
      - https://www.argentina.gob.ar/economia/energia
    notes: "IEA 403(봇 차단). 정부 200 — 에너지청."
  TR:
    sources:
      - https://www.iea.org/countries/turkiye
      - https://www.epdk.gov.tr/
    notes: >-
      IEA 403(봇 차단, 슬러그는 turkiye — turkey 아님). 에너지부 enerji.gov.tr는
      이 네트워크에서 443/80이 필터링되어 접속 불가(타임아웃) → 대체로 에너지시장
      규제청(EPDK) 200을 넣었다.
  SA:
    sources:
      - https://www.iea.org/countries/saudi-arabia
      - https://www.kapsarc.org/
    notes: >-
      IEA 403(봇 차단). **미확인**: 공식 에너지부 moenergy.gov.sa는 DNS는 풀리지만
      443·80이 모두 필터링되어 접속 불가(000, 404 아님). vision2030.gov.sa는 403 WAF.
      접속 가능한 유일한 에너지 정책 기관으로 KAPSARC(200)를 넣었다 — 정부 공식 문서가
      아니므로 사람이 재검토해야 한다.
  ZA:
    sources:
      - https://www.iea.org/countries/south-africa
      - https://www.dee.gov.za/
    notes: >-
      IEA 403(봇 차단). 정부 200 — 2025-04-01 신설된 전기에너지부(DEE).
      energy.gov.za는 TLS 인증서 오류 후 503, dmre.gov.za는 접속 불가라 쓰지 않는다.
  RU:
    sources:
      - https://www.iea.org/countries/russia
      - https://minenergo.gov.ru/
    notes: "IEA 403(봇 차단). 정부 200 — 에너지부."
