# ============================================================
# [모듈 개요] 정성 소스 메타데이터 — webui/macro/llm/* 전용 (registry.yaml과 분리)
#
# 이 파일은 "사람이 관리하는 계약 데이터"다. 정량 지표 레지스트리(registry.yaml)는
# 다른 담당이 소유하므로, 중앙은행 결정문 페이지·위키피디아 여론조사 문서·에너지
# 정책 URL 같은 정성 메타는 여기에만 둔다. 로더는 llm/meta.py:load_sources().
#
# 확인 방법(2026-09-20 실측): 모든 URL을 curl로 직접 호출해 상태코드를 notes에
# 남겼다. 추측한 값은 넣지 않는다 — 확인 못 한 값은 null + note로 표기한다.
#
# 주의할 실측 결과:
#  - iea.org/countries/* 는 Cloudflare 봇 차단으로 **항상 403**이다(잘못된 URL이
#    아님). 슬러그는 iea.org/sitemap-countries.xml(200)에 실제로 존재함을 확인했다.
#  - 정치 메타는 2026-09-20 기준이다. 선거·당명은 바뀌므로 election 블록은
#    분기마다 재확인이 필요하다(TR·RU·IN·ID·ZA는 특히 유동적).
# ============================================================

# ------------------------------------------------------------------ 중앙은행
# iso → {name_ko, name_en, statements_url, rss, lang, notes}
#   refer: EU      → 유로 회원국. 자체 문서를 만들지 않고 EU 문서를 참조한다.
#   link_keywords  → 결정문 링크 선별 패턴. **주면 그 패턴만** 쓴다(strict).
#                    주지 않으면 모듈 기본 규칙 → 일반 키워드 → 날짜 링크로 완화.
#   user_agent: browser → WAF가 봇 UA를 막는 사이트(GB·ID·SA)
#   rss            → 목록이 JS로 렌더링될 때 폴백으로 쓰는 피드
#
# 링크 선별 실측 결과 (2026-09-20, LLM 미사용):
#   본문 확보 성공(8): US 2026-09-16 · EU 2026-09-10(피드) · JP 2026-01-23(이후 회차는
#     PDF만 제공) · KR 2026-09-20 · CN 2026-09-20 · AR(최신 공표가 과거) · AU 2026-08-11 ·
#     CA 2026-09-02.  RU는 결정문을 잡지만 URL에 날짜가 없어 최신 회차 보장 안 됨.
#   링크 없음(5): GB · MX · TR · SA · ZA — 목록이 JS로 렌더링되고 피드도 결정문
#     단위가 아니다. 링크를 못 찾으면 record_error만 남기고 LLM을 호출하지 않는다.
#   링크는 잡히나 본문이 비어 있음(3): IN(prid 페이지 JS) · BR(Angular 셸) · ID(JS).
#     본문 200자 미만은 LLM 전에 버려지므로 잘못된 문서나 비용이 발생하지 않는다.
#   → 이 8개국은 Phase 3에서 렌더링/전용 API 연동이 필요하다(제안서 8장 리스크).
central_banks:
  US:
    name_ko: 연방준비제도
    name_en: Federal Reserve (FOMC)
    statements_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    rss: https://www.federalreserve.gov/feeds/press_monetary.xml
    lang: en
    link_keywords: ["pressreleases/monetary"]
    notes: "200. 회의별 성명 링크(monetary20260128a.htm 등)가 서버 렌더링된다. RSS 200(FRB Press Release - Monetary Policy)."
  EU:
    name_ko: 유럽중앙은행
    name_en: European Central Bank
    statements_url: https://www.ecb.europa.eu/press/govcdec/mopo/html/index.en.html
    rss: https://www.ecb.europa.eu/rss/press.html
    lang: en
    link_keywords: ["ecb.mp"]
    notes: >-
      200. '통화정책 결정' 아카이브(2026-09-10 등). RSS 200이지만 MP 전용이 아니라
      전체 보도자료다(/rss/mopo.html은 404). /press/pr/date/html/index.en.html은
      쿼리 페이지로 302되므로 쓰지 않는다.
  JP:
    name_ko: 일본은행
    name_en: Bank of Japan
    statements_url: https://www.boj.or.jp/en/mopo/mpmdeci/mpr_2026/index.htm
    rss: https://www.boj.or.jp/en/rss/whatsnew.xml
    lang: en
    link_keywords: ["mopo/mpmdeci", "/k26", "/k27"]
    notes: >-
      200. 연도별 색인 페이지(k260918a.pdf 등). **매년 URL의 mpr_YYYY를 갱신해야 한다.**
      허브 /en/mopo/mpmdeci/index.htm(200)은 당해 연도만 링크한다. MP 전용 피드 없음.
  GB:
    name_ko: 영란은행
    name_en: Bank of England (MPC)
    statements_url: https://www.bankofengland.co.uk/monetary-policy-summary-and-minutes/monetary-policy-summary-and-minutes
    rss: https://www.bankofengland.co.uk/rss/news
    lang: en
    user_agent: browser
    link_keywords: ["monetary-policy-summary-and-minutes/20"]
    notes: >-
      200 — 경로 세그먼트가 **두 번 반복**되어야 한다(단일 세그먼트와 /news/monetary-policy는 404).
      목록이 JS로 렌더링되어 원문 HTML에 날짜 링크가 없다 → 규칙 파서가 실패할 수 있고
      항목 URL은 /{year}/{month}-{year} 형태다. RSS 200(뉴스 전체).
  KR:
    name_ko: 한국은행
    name_en: Bank of Korea
    statements_url: "https://www.bok.or.kr/portal/singl/crncyPolicyDrcMtg/listYear.do?menuNo=200755&mtgSe=A"
    rss: null
    lang: ko
    link_keywords: ["crncyPolicyDrcMtg", "통화정책방향", "결정문"]
    notes: >-
      200 — '통화정책방향 결정회의(목록)'. 2026년 회의별 결정문·보도자료 첨부가 붙는다.
      경고: 흔히 쓰는 게시판 /portal/bbs/P0000559/list.do 는 200이지만 본문이
      '콘텐츠 준비중입니다'로 비어 있어 쓰지 않는다. RSS 없음(모두 에러페이지).
  CN:
    name_ko: 중국인민은행
    name_en: People's Bank of China
    statements_url: https://www.pbc.gov.cn/zhengcehuobisi/125207/125213/125440/3876551/index.html
    rss: https://www.pbc.gov.cn/goutongjiaoliu/113456/2986536/index.html
    lang: zh
    link_keywords: ["zhengcehuobisi", "lpr"]
    notes: >-
      200 — 贷款市场报价利率(LPR) 공고 목록(2026-09-20, 08-20, 07-20 ...).
      RSS URL은 content-type이 text/html이지만 실제로는 RSS 2.0 문서이며 LPR 전용이 아니다.
  IN:
    name_ko: 인도준비은행
    name_en: Reserve Bank of India
    statements_url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx
    rss: https://www.rbi.org.in/pressreleases_rss.xml
    lang: en
    link_keywords: ["prid="]
    notes: "200 — 서버 렌더링 보도자료 목록(prid 링크). 신 포털 website.rbi.org.in은 200이나 본문이 JS 렌더링이다. RSS 200."
  BR:
    name_ko: 브라질중앙은행
    name_en: Banco Central do Brasil (Copom)
    statements_url: https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/comunicadoscopom
    rss: https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/comunicadoscopom
    lang: en
    link_keywords: ["copom", "comunicado"]
    notes: >-
      200 — HTML 페이지(/en/monetarypolicy/copomstatements, 200)는 Angular 셸이라
      원문에 성명이 없다. **Atom 피드를 statements_url로 사용**한다(281ª 회의
      2026-09-16 등 채워져 있음). `sitefeeds` 없는 경로는 오류 문서를 반환한다.
  MX:
    name_ko: 멕시코중앙은행
    name_en: Banco de México
    statements_url: https://www.banxico.org.mx/publications-and-press/announcements-of-monetary-policy-decisions/monetary-policy-announcements.html
    rss: null
    lang: en
    link_keywords: ["announcements-of-monetary-policy", "politica-monetaria"]
    notes: "200 — 서버 렌더링 목록(08/06/26 'kept unchanged at 6.50 per cent' 등). RSS 없음(후보 URL 전부 404)."
  AR:
    name_ko: 아르헨티나중앙은행
    name_en: Banco Central de la República Argentina (BCRA)
    statements_url: https://www.bcra.gob.ar/ultimos-comunicados-de-politica-monetaria/
    rss: null
    lang: es
    link_keywords: ["comunicado", "politica-monetaria"]
    notes: >-
      200 — 'Últimos Comunicados De Política Monetaria' 날짜 목록.
      최신 항목이 2025-10인 것은 BCRA 자체 공표 주기 탓이며 수집 실패가 아니다.
      WordPress 피드는 비활성(/feed/ 500).
  TR:
    name_ko: 튀르키예중앙은행
    name_en: Central Bank of the Republic of Türkiye (TCMB)
    statements_url: https://www.tcmb.gov.tr/wps/wcm/connect/EN/TCMB+EN/MPC/MPC+Meeting+Decisions
    rss: https://www.tcmb.gov.tr/wps/wcm/connect/EN/TCMB+EN/Bottom+Menu/Other/RSS/MPC+Decisions
    lang: en
    link_keywords: ["press+release+on+interest+rates"]
    notes: >-
      200 — 'Press Release on Interest Rates (2026-28)' 등 금리 결정 목록.
      RSS는 200이지만 **2025-12 이후 갱신이 멈춘 stale 피드**라 HTML을 긁어야 한다.
      .../Press+Releases/Press+Releases+on+Interest+Rates 는 404다.
  SA:
    name_ko: 사우디중앙은행
    name_en: Saudi Central Bank (SAMA)
    statements_url: https://www.sama.gov.sa/en-US/MediaCenter/News/pages/allnews.aspx
    rss: null
    lang: en
    user_agent: browser
    link_keywords: ["news-", "repo"]
    notes: >-
      200 — SharePoint 목록 JSON에 날짜 항목(2026-09-17 등)과 news-1164.aspx 링크가 있다.
      F5/TSPD 봇 차단이 있어 **브라우저 UA가 필요**하고, 봇 UA로는 '200 + 챌린지 본문'이
      올 수 있으므로 본문 검증이 필수다. /en-US/News/* 경로는 404다.
  ZA:
    name_ko: 남아프리카준비은행
    name_en: South African Reserve Bank (SARB)
    statements_url: https://www.resbank.co.za/en/home/publications/statements/mpc-statements
    rss: https://www.resbank.co.za/bin/sarb/solr/publications/rss
    lang: en
    link_keywords: ["monetary-policy-statements"]
    notes: >-
      200 — 'MPC Statements'. 목록이 Solr 검색 서비스로 로드되어 원문 HTML에 링크가 없고
      확인 시점에 '검색 서비스 장애' 메시지가 떠 있었다 → **RSS(200, 뉴스+간행물 통합)**
      경로를 폴백으로 써야 한다. 항목 URL은 .../statements/monetary-policy-statements/{year}/{month}.
  ID:
    name_ko: 인도네시아은행
    name_en: Bank Indonesia
    statements_url: https://www.bi.go.id/en/publikasi/ruang-media/news-release/default.aspx
    rss: null
    lang: en
    user_agent: browser
    link_keywords: ["bi-rate", "moneter"]
    notes: >-
      봇 UA로는 연결이 리셋되어 000, **브라우저 UA + HTTP/1.1로는 200**(2026-09-10 등
      날짜 목록, BI-Rate 결정도 같은 게시판에 올라온다). RSS 없음.
  AU:
    name_ko: 호주준비은행
    name_en: Reserve Bank of Australia
    statements_url: https://www.rba.gov.au/monetary-policy/int-rate-decisions/
    rss: https://www.rba.gov.au/rss/rss-cb-media-releases.xml
    lang: en
    link_keywords: ["monetary-policy-decision", "media-releases/20"]
    notes: "200 — 'Monetary Policy Decision' 항목과 int-rate-decisions/2026 링크. RSS 200(RDF 1.0)."
  CA:
    name_ko: 캐나다은행
    name_en: Bank of Canada
    statements_url: https://www.bankofcanada.ca/press/press-releases/
    rss: https://www.bankofcanada.ca/content_type/press-releases/feed/
    lang: en
    link_keywords: ["fad-press-release"]
    notes: >-
      200 — 서버 렌더링. 금리 결정은 `fad-press-release-YYYY-MM-DD` 슬러그라
      link_keywords로 정확히 걸러진다(2026-09-02 'maintains the policy rate at 2¼%').
  RU:
    name_ko: 러시아중앙은행
    name_en: Bank of Russia
    statements_url: https://www.cbr.ru/eng/dkp/mp_dec/
    rss: https://www.cbr.ru/rss/RssPress
    lang: en
    link_keywords: ["eng_bor", "dkp/mp_dec"]
    notes: >-
      200 — 'Monetary policy decisions' 서버 렌더링 목록(2026-09-11 14.00% 유지 등).
      /press/keypr/ 는 최신 1건만 렌더링하는 상세 페이지라 목록으로 쓰면 안 된다.
      RSS 200(러시아어 '보도자료').
  DE:
    name_ko: 독일연방은행 (유로존 공통)
    name_en: Deutsche Bundesbank
    refer: EU
    lang: de
    notes: "유로 회원국 — 통화정책은 ECB 단일 결정이므로 EU 문서를 참조한다(자체 문서 생성 없음)."
  FR:
    name_ko: 프랑스은행 (유로존 공통)
    name_en: Banque de France
    refer: EU
    lang: fr
    notes: "유로 회원국 — EU 문서 참조."
  IT:
    name_ko: 이탈리아은행 (유로존 공통)
    name_en: Banca d'Italia
    refer: EU
    lang: it
    notes: "유로 회원국 — EU 문서 참조."

# ------------------------------------------------------------------ 여론조사·선거
# 20개 엔트리 = 여론조사 대상 17개국 + not_applicable 3개(CN·SA·EU).
# party_aliases의 별칭은 **위키 표의 실제 컬럼 헤더 문자열**이다(약칭 그대로).
#
# 규칙 파서 실측 추출 건수 (2026-09-20, 표 최대 2개 × 40행):
#   KR 80 · GB 79 · FR 69 · RU 61 · BR 61 · IT 46 · JP 45 · CA 39 · DE 38 · MX 26 ·
#   AU 24 · AR 17 · US 6(집계기관 행) · ID 2 · ZA 1 · IN 0 · TR 0
#   IN=0은 표가 정당 지지율이 아니라 연합별 예상 의석수여서 합계 규칙에 걸리는 것이고,
#   TR=0은 사용 가능한 위키 문서가 없기 때문이다(둘 다 구조적 한계, 파서 버그 아님).
